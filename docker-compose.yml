version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-app:latest
    container_name: crm-application
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${DB_HOST:-mysql-server}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-crm}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport
      - TZ=UTC
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/appinfo/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  crm-network:
    driver: bridge

volumes:
  config:
  logs:
